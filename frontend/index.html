<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Taxi</title>
<style>
body{font-family:Arial;background:#f5f6f8;margin:0;color:#1d2430}
header{padding:16px;background:#1e2530;color:#d8b36a}
main{max-width:700px;margin:20px auto;padding:0 12px}
.card{background:#fff;padding:16px;border-radius:10px;margin:10px 0}
input,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{background:#d8b36a;border:0;font-weight:bold}
#msg{color:#b00;font-size:14px}
</style>
</head>
<body>
<header><b>Golden Taxi — Chiron</b></header>
<main>
<div class="card">
<h2>دخول الإدارة</h2>
<input id="pw" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
<p id="msg"></p>
</div>
</main>
<script>
async function login(){
  var msg = document.getElementById('msg');
  var pw = document.getElementById('pw').value;
  msg.textContent = 'جاري التحقق...';
  try {
    var r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: pw})
    });
    var d = await r.json();
    if(r.ok && d.token){
      localStorage.setItem('golden', d.token);
      msg.style.color = 'green';
      msg.textContent = 'تم الدخول بنجاح';
    } else {
      msg.style.color = '#b00';
      msg.textContent = d.error || 'كلمة المرور غير صحيحة';
    }
  } catch(e){
    msg.style.color = '#b00';
    msg.textContent = 'خطأ في الاتصال: ' + e.message;
  }
}
</script>
</body>
</html>
