<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Taxi</title><style>body{font-family:Arial;background:#f5f6f8;margin:0;color:#1d2430}header{padding:16px 24px;background:#1e2530;color:#d8b36a;display:flex;justify-content:space-between}main{max-width:1120px;margin:22px auto;padding:0 14px}.card{background:#fff;padding:18px;border-radius:10px;margin:12px 0;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:7px}input,select,button{padding:10px;border:1px solid #cbd3dd;border-radius:6px;margin:3px}button{background:#d8b36a;cursor:pointer;border:0}.hidden{display:none}.small{font-size:13px;color:#667}.ok{color:green}.bad{color:#b00}pre{white-space:pre-wrap;background:#f4f4f4;padding:10px}</style><header><b>◇ Golden Taxi — Chiron</b><button onclick="logout()">خروج</button></header><main><section id="login" class="card"><h2>دخول الإدارة</h2><input id="pw" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><p id="loginMsg"></p></section><section id="app" class="hidden"><div class="card"><h2>1. إضافة شركة وبيانات Chiron</h2><div class="grid"><input id="name" placeholder="اسم الشركة القانوني"><input id="kbo" placeholder="KBO / ondernemingsnummer"><input id="email" placeholder="البريد"><input id="phone" placeholder="الهاتف"><input id="testClientId" placeholder="TEST Client ID"><input id="testSecret" type="password" placeholder="TEST Client Secret"><input id="productionClientId" placeholder="Production Client ID لاحقاً"><input id="productionSecret" type="password" placeholder="Production Client Secret لاحقاً"></div><button onclick="addCompany()">حفظ الشركة</button><p class="small">لا يظهر الـ Secret بعد الحفظ ولا يُرسل للمتصفح.</p></div><div class="card"><h2>الشركات واختبار Chiron TEST</h2><div id="companies"></div></div><div class="card"><h2>2. رحلة اختبار</h2><p class="small">أنشئ رحلة ثم START، وبعدها أدخل GPS الوصول والمسافة والسعر ثم STOP. لا تستخدم بيانات حقيقية في TEST.</p><div class="grid"><select id="companyId"></select><input id="tripNumber" placeholder="رقم الرحلة، مثل TEST-001"><input id="companyName" placeholder="اسم الشركة"><input id="tripKbo" placeholder="KBO"><input id="plate" placeholder="رقم اللوحة"><input id="driverCard" placeholder="رقم بطاقة السائق"><input id="startLat" placeholder="Start latitude, مثال 50.8503"><input id="startLng" placeholder="Start longitude, مثال 4.3517"></div><button onclick="createTrip()">إنشاء رحلة</button><div id="trips"></div></div><div class="card"><h2>سجل رسائل Chiron</h2><div id="messages"></div></div></section></main><script>let token=localStorage.golden,companies=[];const $=x=>document.getElementById(x);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let r=await fetch(u,o),d=await r.json();if(r.status===401)logout();return d}function show(){if(token){$('login').className='hidden';$('app').className='';load()}}async function login(){let d=await api('/api/login',{method:'POST',body:JSON.stringify({password:$('pw').value})});if(d.token){token=d.token;localStorage.golden=token;show()}else $('loginMsg').textContent=d.error||'فشل'}function logout(){localStorage.removeItem('golden');location.reload()}async function addCompany(){let b={};['name','kbo','email','phone','testClientId','testSecret','productionClientId','productionSecret'].forEach(i=>b[i]=$(i).value);let d=await api('/api/companies',{method:'POST',body:JSON.stringify(b)});if(d.error)alert(d.error);else{alert('تم حفظ الشركة');load()}}async function hello(id){let d=await api('/api/chiron/'+id+'/hello',{method:'POST',body:JSON.stringify({environment:'test'})});alert(d.ok?'نجح الاتصال: '+JSON.stringify(d.response):'فشل: '+JSON.stringify(d.error))}async function createTrip(){let b={companyId:$('companyId').value,tripNumber:$('tripNumber').value,kbo:$('tripKbo').value,companyName:$('companyName').value,plate:$('plate').value,driverCard:$('driverCard').value,startLat:$('startLat').value,startLng:$('startLng').value};let d=await api('/api/trips',{method:'POST',body:JSON.stringify(b)});if(d.error)alert(d.error);else load()}async function start(id){let d=await api('/api/trips/'+id+'/start',{method:'POST',body:JSON.stringify({environment:'test'})});alert(d.ok?'START نجح':'خطأ: '+JSON.stringify(d.error));load()}async function stop(id){let lat=prompt('Aankomst latitude');let lng=prompt('Aankomst longitude');let km=prompt('المسافة KM، مثال 12.345');let price=prompt('السعر EUR، مثال 22.50');let d=await api('/api/trips/'+id+'/stop',{method:'POST',body:JSON.stringify({environment:'test',endLat:lat,endLng:lng,distanceKm:km,price:price})});alert(d.ok?'STOP نجح':'خطأ: '+JSON.stringify(d.error));load()}async function load(){companies=await api('/api/companies');let trips=await api('/api/trips'),msgs=await api('/api/messages');$('companies').innerHTML=companies.map(c=>`<div class="card"><b>${esc(c.name)}</b> — KBO: ${esc(c.kbo)}<br>TEST: ${c.chiron.test.configured?'مضبوط':'ناقص'} <button onclick="hello('${c.id}')">اختبار hello</button></div>`).join('')||'لا توجد شركة';$('companyId').innerHTML=companies.map(c=>`<option value="${c.id}" data-kbo="${esc(c.kbo)}" data-name="${esc(c.name)}">${esc(c.name)}</option>`).join('');let s=$('companyId');if(s.value){let o=s.options[s.selectedIndex];$('tripKbo').value=o.dataset.kbo;$('companyName').value=o.dataset.name}s.onchange=()=>{let o=s.options[s.selectedIndex];$('tripKbo').value=o.dataset.kbo;$('companyName').value=o.dataset.name};$('trips').innerHTML=trips.map(t=>`<div class="card"><b>${esc(t.tripNumber)}</b> — ${esc(t.status)}<br>${esc(t.plate)} / ${esc(t.driverCard)}<br>${t.status==='BOOKED'?`<button onclick="start('${t.id}')">START / vertrek</button>`:''}${t.status==='STARTED'?`<button onclick="stop('${t.id}')">STOP / aankomst</button>`:''}</div>`).join('')||'لا توجد رحلات';$('messages').innerHTML=msgs.slice().reverse().map(m=>`<pre class="${m.ok?'ok':'bad'}">${esc(m.status)} | ${esc(m.environment)} | ${esc(m.at)}
${esc(JSON.stringify(m.response))}</pre>`).join('')||'لا توجد رسائل'}show()</script>
