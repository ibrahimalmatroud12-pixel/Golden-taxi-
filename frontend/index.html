<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Taxi</title>
<style>
body{font-family:Arial;background:#f5f6f8;margin:0;color:#1d2430}
header{padding:16px;background:#1e2530;color:#d8b36a;display:flex;justify-content:space-between}
main{max-width:900px;margin:16px auto;padding:0 12px}
.card{background:#fff;padding:16px;border-radius:10px;margin:10px 0}
input,select,button{width:100%;padding:11px;margin:5px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{background:#d8b36a;border:0;font-weight:bold}
.small{font-size:13px;color:#667}
.ok{color:green}.bad{color:#b00}
pre{white-space:pre-wrap;background:#f4f4f4;padding:8px;border-radius:6px;font-size:12px}
.hidden{display:none}
</style>
</head>
<body>
<header><b>Golden Taxi — Chiron</b><button onclick="logout()">خروج</button></header>
<main>

<div id="login" class="card">
<h2>دخول الإدارة</h2>
<input id="pw" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
<p id="loginMsg"></p>
</div>

<div id="app" class="hidden">

<div class="card">
<h2>إضافة شركة</h2>
<input id="name" placeholder="اسم الشركة">
<input id="kbo" placeholder="KBO">
<input id="testClientId" placeholder="TEST Client ID">
<input id="testSecret" type="password" placeholder="TEST Client Secret">
<button onclick="addCompany()">حفظ الشركة</button>
<p id="companyMsg" class="small"></p>
</div>

<div class="card">
<h2>الشركات</h2>
<div id="companies"></div>
</div>

<div class="card">
<h2>رحلة اختبار</h2>
<select id="companyId"></select>
<input id="tripNumber" placeholder="رقم الرحلة مثل TEST-001">
<input id="plate" placeholder="رقم اللوحة">
<input id="driverCard" placeholder="رقم بطاقة السائق">
<input id="startLat" placeholder="Start latitude مثل 50.8503">
<input id="startLng" placeholder="Start longitude مثل 4.3517">
<button onclick="createTrip()">إنشاء رحلة</button>
<div id="trips"></div>
</div>

<div class="card">
<h2>رسائل Chiron</h2>
<div id="messages"></div>
</div>

</div>
</main>

<script>
var token = localStorage.getItem('golden');

function $(id){return document.getElementById(id)}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}

async function api(url, options){
  options = options || {};
  options.headers = options.headers || {};
  options.headers['Content-Type'] = 'application/json';
  if(token) options.headers['Authorization'] = 'Bearer ' + token;
  var r = await fetch(url, options);
  var d = await r.json();
  if(r.status === 401){ logout(); }
  return d;
}

function show(){
  if(token){
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    load();
  }
}

async function login(){
  var pw = $('pw').value;
  $('loginMsg').textContent = 'جاري التحقق...';
  try{
    var d = await api('/api/login', {method:'POST', body: JSON.stringify({password: pw})});
    if(d.token){
      token = d.token;
      localStorage.setItem('golden', token);
      $('loginMsg').style.color = 'green';
      $('loginMsg').textContent = 'تم الدخول بنجاح';
      show();
    } else {
      $('loginMsg').style.color = '#b00';
      $('loginMsg').textContent = d.error || 'كلمة المرور غير صحيحة';
    }
  }catch(e){
    $('loginMsg').style.color = '#b00';
    $('loginMsg').textContent = 'خطأ: ' + e.message;
  }
}

function logout(){
  localStorage.removeItem('golden');
  location.reload();
}

async function addCompany(){
  var body = {
    name: $('name').value,
    kbo: $('kbo').value,
    testClientId: $('testClientId').value,
    testSecret: $('testSecret').value
  };
  var d = await api('/api/companies', {method:'POST', body: JSON.stringify(body)});
  if(d.error){ $('companyMsg').textContent = d.error; }
  else{ $('companyMsg').style.color='green'; $('companyMsg').textContent='تم حفظ الشركة'; load(); }
}

async function hello(id){
  var d = await api('/api/chiron/' + id + '/hello', {method:'POST', body: JSON.stringify({environment:'test'})});
  alert(d.ok ? 'نجح الاتصال' : 'فشل: ' + JSON.stringify(d.error));
  load();
}

async function createTrip(){
  var body = {
    companyId: $('companyId').value,
    tripNumber: $('tripNumber').value,
    kbo: companies.length ? companies.find(c=>c.id===$('companyId').value).kbo : '',
    companyName: companies.length ? companies.find(c=>c.id===$('companyId').value).name : '',
    plate: $('plate').value,
    driverCard: $('driverCard').value,
    startLat: $('startLat').value,
    startLng: $('startLng').value
  };
  var d = await api('/api/trips', {method:'POST', body: JSON.stringify(body)});
  if(d.error){ alert(d.error); } else { load(); }
}

async function startTrip(id){
  var d = await api('/api/trips/' + id + '/start', {method:'POST', body: JSON.stringify({environment:'test'})});
  alert(d.ok ? 'START نجح' : 'خطأ: ' + JSON.stringify(d.error));
  load();
}

async function stopTrip(id){
  var lat = prompt('Aankomst latitude');
  var lng = prompt('Aankomst longitude');
  var km = prompt('المسافة KM');
  var price = prompt('السعر EUR');
  var d = await api('/api/trips/' + id + '/stop', {method:'POST', body: JSON.stringify({environment:'test', endLat:lat, endLng:lng, distanceKm:km, price:price})});
  alert(d.ok ? 'STOP نجح' : 'خطأ: ' + JSON.stringify(d.error));
  load();
}

var companies = [];

async function load(){
  companies = await api('/api/companies');
  var trips = await api('/api/trips');
  var messages = await api('/api/messages');

  $('companies').innerHTML = companies.map(function(c){
    return '<div class="card"><b>' + esc(c.name) + '</b> — KBO: ' + esc(c.kbo) +
      '<br>TEST: ' + (c.chiron.test.configured ? 'مضبوط' : 'ناقص') +
      ' <button onclick="hello(\'' + c.id + '\')">اختبار hello</button></div>';
  }).join('') || 'لا توجد شركة';

  $('companyId').innerHTML = companies.map(function(c){
    return '<option value="' + c.id + '">' + esc(c.name) + '</option>';
  }).join('');

  $('trips').innerHTML = trips.map(function(t){
    var buttons = '';
    if(t.status === 'BOOKED'){ buttons = '<button onclick="startTrip(\'' + t.id + '\')">START / vertrek</button>'; }
    if(t.status === 'STARTED'){ buttons = '<button onclick="stopTrip(\'' + t.id + '\')">STOP / aankomst</button>'; }
    return '<div class="card"><b>' + esc(t.tripNumber) + '</b> — ' + esc(t.status) +
      '<br>' + esc(t.plate) + ' / ' + esc(t.driverCard) + '<br>' + buttons + '</div>';
  }).join('') || 'لا توجد رحلات';

  $('messages').innerHTML = messages.slice().reverse().map(function(m){
    return '<pre class="' + (m.ok ? 'ok' : 'bad') + '">' + esc(m.status) + ' | ' + esc(m.environment) + ' | ' + esc(m.at) + '\n' + esc(JSON.stringify(m.response)) + '</pre>';
  }).join('') || 'لا توجد رسائل';
}

show();
</script>
</body>
</html>
